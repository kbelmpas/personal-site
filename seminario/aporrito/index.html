<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Πολιτική Απορρήτου — Σεμινάριο Β Θεμάτων Φυσικής</title>
  <meta name="description" content="Πολιτική απορρήτου του σεμιναρίου Β Θεμάτων Φυσικής Πανελληνίων." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    :root {
      --bg: #0A0F1E;
      --surface: #101A30;
      --accent: #00B4D8;
      --accent-dim: rgba(0, 180, 216, 0.14);
      --border: rgba(255, 255, 255, 0.08);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
    }

    #legal {
      padding-top: calc(64px + 90px);
    }

    #legal .container {
      max-width: 680px;
    }

    .legal-back {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .legal-back:hover {
      color: var(--accent);
    }

    #legal p {
      color: var(--muted);
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.1rem;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="container">
      <a href="/index.html" class="topbar-brand">Κωνσταντίνος Μπέλμπας</a>
    </div>
  </div>

  <section id="legal">
    <div class="container">
      <a href="/seminario/" class="legal-back">← Πίσω στο σεμινάριο</a>
      <h1>Πολιτική Απορρήτου</h1>
      <p>[ΚΕΙΜΕΝΟ ΣΕ ΑΝΑΜΟΝΗ]</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Κωνσταντίνος Μπέλμπας</p>
    <div class="footer-links">
      <a href="/seminario/oroi">Όροι αγοράς</a>
      <a href="/seminario/aporrito">Πολιτική απορρήτου</a>
    </div>
  </footer>

</body>
</html>
